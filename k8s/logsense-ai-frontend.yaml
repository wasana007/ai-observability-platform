apiVersion: apps/v1
kind: Deployment
metadata:
  name: logsense-ai-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logsense-ai-frontend
  template:
    metadata:
      labels:
        app: logsense-ai-frontend
      annotations:
        rollme: "1"
    spec:
      containers:
        - name: frontend
          image: logsense-ai-frontend:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: logsense-ai-frontend-service
spec:
  selector:
    app: logsense-ai-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP